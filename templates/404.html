<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | Compound Tennis Booking</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: white;
            text-align: center;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.58),
                    rgba(0, 0, 0, 0.82)
                ),
                url("https://images.unsplash.com/photo-1595435934249-5df7ed86e1c0?auto=format&fit=crop&w=1800&q=85");

            background-size: cover;
            background-position: center;
        }

        .card {
            width: 100%;
            max-width: 520px;
            padding: 48px 34px;

            background: rgba(15, 19, 16, 0.76);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 24px;

            box-shadow: 0 24px 65px rgba(0, 0, 0, 0.42);
        }

        .icon {
            font-size: 68px;
            margin-bottom: 18px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: clamp(34px, 7vw, 58px);
        }

        p {
            margin-bottom: 28px;
            color: rgba(255, 255, 255, 0.76);
            line-height: 1.6;
        }

        a {
            min-height: 50px;
            padding: 13px 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background: linear-gradient(135deg, #4ea326, #79d143);
            color: white;

            text-decoration: none;
            font-weight: 750;

            transition: 0.2s ease;
        }

        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(95, 190, 45, 0.3);
        }
    </style>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/mobile.css') }}">

</head>

<body>

    <main class="card">
        <div class="icon">🎾</div>

        <h1>404</h1>

        <p>
            The page you’re looking for doesn’t exist or may have been moved.
        </p>

        <a href="{{ url_for('landing') }}">
            Return to homepage
        </a>
    </main>

</body>
</html>
