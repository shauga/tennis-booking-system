<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Change Password | Compound Tennis Booking</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
    --accent:#79d143;
    --accent-dark:#4ea326;
    --text:#ffffff;
    --muted:rgba(255,255,255,.68);
    --glass:rgba(14,20,15,.84);
    --border:rgba(255,255,255,.14);
    --danger:#ffb4b4;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Segoe UI',sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
    color:var(--text);
    background:
        linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.84)),
        url("https://images.unsplash.com/photo-1595435934249-5df7ed86e1c0?auto=format&fit=crop&w=2000&q=85");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

.card{
    width:100%;
    max-width:470px;
    padding:34px;
    border:1px solid var(--border);
    border-radius:24px;
    background:var(--glass);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 24px 70px rgba(0,0,0,.42);
}

.security-badge{
    width:max-content;
    margin:0 auto 18px;
    padding:7px 11px;
    display:flex;
    align-items:center;
    gap:7px;
    border:1px solid rgba(121,209,67,.22);
    border-radius:999px;
    background:rgba(121,209,67,.10);
    color:#dfffd0;
    font-size:11px;
    font-weight:800;
    letter-spacing:.08em;
}

.lock-icon{
    width:58px;
    height:58px;
    margin:0 auto 14px;
    display:grid;
    place-items:center;
    border-radius:17px;
    background:linear-gradient(135deg,var(--accent-dark),var(--accent));
    box-shadow:0 12px 28px rgba(78,163,38,.28);
    font-size:27px;
}

h2{
    text-align:center;
    font-size:29px;
    margin-bottom:8px;
}

.subtitle{
    max-width:340px;
    margin:0 auto 27px;
    color:var(--muted);
    text-align:center;
    font-size:14px;
    line-height:1.55;
}

.error{
    margin-bottom:18px;
    padding:12px 14px;
    border:1px solid rgba(255,100,100,.22);
    border-radius:11px;
    background:rgba(180,40,40,.18);
    color:var(--danger);
    font-size:13px;
    font-weight:700;
    line-height:1.45;
}

.input-group{
    margin-bottom:16px;
}

.input-group label{
    display:block;
    margin:0 0 7px 2px;
    color:rgba(255,255,255,.88);
    font-size:12px;
    font-weight:700;
}

.input-wrap{
    position:relative;
}

input{
    width:100%;
    min-height:54px;
    padding:14px 50px 14px 15px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:12px;
    background:rgba(255,255,255,.94);
    color:#1c241d;
    outline:none;
    font-size:15px;
    transition:.2s;
}

input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(121,209,67,.15);
}

.toggle{
    position:absolute;
    top:50%;
    right:8px;
    width:38px;
    height:38px;
    transform:translateY(-50%);
    display:grid;
    place-items:center;
    border:0;
    border-radius:9px;
    background:transparent;
    cursor:pointer;
    font-size:17px;
}

.password-meter{
    margin:-5px 0 17px;
}

.meter-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:7px;
    color:var(--muted);
    font-size:10px;
}

#strengthText{
    color:#dfffd0;
    font-weight:800;
}

.meter-track{
    height:5px;
    overflow:hidden;
    border-radius:999px;
    background:rgba(255,255,255,.10);
}

.meter-fill{
    width:0;
    height:100%;
    border-radius:999px;
    background:var(--accent);
    transition:width .25s ease;
}

.requirements{
    margin:0 0 20px;
    padding:13px 14px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:12px;
    background:rgba(255,255,255,.045);
}

.requirement{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--muted);
    font-size:11px;
    line-height:1.6;
}

.requirement + .requirement{
    margin-top:3px;
}

.requirement .check{
    color:var(--accent);
    font-weight:900;
}

.submit-button{
    width:100%;
    min-height:52px;
    padding:14px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,var(--accent-dark),var(--accent));
    color:white;
    font-size:14px;
    font-weight:850;
    cursor:pointer;
    box-shadow:0 12px 24px rgba(78,163,38,.22);
    transition:.2s;
}

.submit-button:hover{
    transform:translateY(-1px);
    filter:brightness(1.05);
}

.back-link{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    width:max-content;
    margin:20px auto 0;
    color:rgba(255,255,255,.76);
    text-decoration:none;
    font-size:13px;
    font-weight:700;
}

.back-link:hover{
    color:white;
}

@media(max-width:600px){
    body{
        align-items:flex-start;
        padding:18px 13px 30px;
        background-attachment:scroll;
    }

    .card{
        margin-top:4vh;
        padding:25px 17px;
        border-radius:20px;
    }

    h2{
        font-size:25px;
    }

    .subtitle{
        font-size:13px;
        margin-bottom:23px;
    }

    input{
        min-height:52px;
        font-size:16px;
    }

    .submit-button{
        min-height:54px;
        font-size:15px;
    }
}
</style>

<link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#4ea326">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
</head>

<body>

<main class="card">
    <div class="security-badge">● ACCOUNT SECURITY</div>
    <div class="lock-icon">🔒</div>

    <h2>Change Password</h2>

    <p class="subtitle">
        Keep your account protected by choosing a secure password.
    </p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="input-group">
            <label for="current_password">Current password</label>
            <div class="input-wrap">
                <input
                    type="password"
                    id="current_password"
                    name="current_password"
                    placeholder="Enter current password"
                    autocomplete="current-password"
                    required>
                <button class="toggle" type="button"
                    onclick="togglePassword('current_password', this)"
                    aria-label="Show current password">👁️</button>
            </div>
        </div>

        <div class="input-group">
            <label for="new_password">New password</label>
            <div class="input-wrap">
                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    placeholder="Enter new password"
                    autocomplete="new-password"
                    required>
                <button class="toggle" type="button"
                    onclick="togglePassword('new_password', this)"
                    aria-label="Show new password">👁️</button>
            </div>
        </div>

        <div class="password-meter">
            <div class="meter-row">
                <span>Password strength</span>
                <span id="strengthText">Not entered</span>
            </div>
            <div class="meter-track">
                <div class="meter-fill" id="strengthFill"></div>
            </div>
        </div>

        <div class="requirements">
            <div class="requirement">
                <span class="check">✓</span>
                <span>Use at least 8 characters</span>
            </div>
            <div class="requirement">
                <span class="check">✓</span>
                <span>Use a password different from your current password</span>
            </div>
        </div>

        <div class="input-group">
            <label for="confirm_password">Confirm new password</label>
            <div class="input-wrap">
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter new password"
                    autocomplete="new-password"
                    required>
                <button class="toggle" type="button"
                    onclick="togglePassword('confirm_password', this)"
                    aria-label="Show confirmed password">👁️</button>
            </div>
        </div>

        <button class="submit-button" type="submit">
            Update Password
        </button>
    </form>

    <a class="back-link" href="/profile">← Back to Profile</a>
</main>

<script>
function togglePassword(id, button){
    const input = document.getElementById(id);
    const showing = input.type === "text";

    input.type = showing ? "password" : "text";
    button.textContent = showing ? "👁️" : "🙈";
    button.setAttribute(
        "aria-label",
        showing ? "Show password" : "Hide password"
    );
}

const newPassword = document.getElementById("new_password");
const strengthFill = document.getElementById("strengthFill");
const strengthText = document.getElementById("strengthText");

newPassword.addEventListener("input", function(){
    const value = this.value;

    if(!value){
        strengthFill.style.width = "0%";
        strengthText.textContent = "Not entered";
        return;
    }

    let score = 0;
    if(value.length >= 8) score++;
    if(value.length >= 12) score++;
    if(/[A-Z]/.test(value) && /[a-z]/.test(value)) score++;
    if(/[0-9]/.test(value)) score++;
    if(/[^A-Za-z0-9]/.test(value)) score++;

    if(score <= 1){
        strengthFill.style.width = "25%";
        strengthText.textContent = "Weak";
    }else if(score <= 3){
        strengthFill.style.width = "60%";
        strengthText.textContent = "Good";
    }else{
        strengthFill.style.width = "100%";
        strengthText.textContent = "Strong";
    }
});
</script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register(
            "{{ url_for('static', filename='service-worker.js') }}"
        );
    });
}
</script>

</body>
</html>
