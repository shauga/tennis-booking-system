<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>403 | Compound Tennis Booking</title>
        <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Arial,sans-serif}
        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
            color:white;
            background:
                linear-gradient(rgba(0,0,0,.58),rgba(0,0,0,.78)),
                url("https://images.unsplash.com/photo-1595435934249-5df7ed86e1c0?auto=format&fit=crop&w=1800&q=85");
            background-size:cover;
            background-position:center;
        }
        .card{
            width:100%;
            max-width:560px;
            padding:48px 38px;
            text-align:center;
            background:rgba(12,20,15,.76);
            backdrop-filter:blur(18px);
            -webkit-backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,.16);
            border-radius:24px;
            box-shadow:0 24px 70px rgba(0,0,0,.45);
        }
        .icon{font-size:58px;margin-bottom:18px}
        .code{font-size:clamp(3rem,10vw,5rem);font-weight:900;color:#7bd144;line-height:1}
        h1{margin:14px 0 12px;font-size:clamp(1.8rem,5vw,2.5rem)}
        p{color:rgba(255,255,255,.75);line-height:1.65;font-size:15px}
        .actions{margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
        a{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            min-height:48px;
            padding:12px 18px;
            border-radius:11px;
            text-decoration:none;
            font-weight:750;
        }
        .primary{background:linear-gradient(135deg,#58af2d,#8bd94f);color:white}
        .secondary{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.15);color:white}
        .note{margin-top:18px;font-size:13px;color:rgba(255,255,255,.52)}
        @media(max-width:600px){.card{padding:38px 22px}.actions{flex-direction:column}a{width:100%}}
</style>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/mobile.css') }}">
<link
    rel="manifest"
    href="{{ url_for('static', filename='manifest.json') }}"
>

<meta name="theme-color" content="#4ea326">

<link
    rel="apple-touch-icon"
    href="{{ url_for('static', filename='icons/icon-192.png') }}"
>
    </head>
    <body>
        <main class="card">
            <div class="icon" aria-hidden="true">🛡️</div>
            <div class="code">403</div>
            <h1>Access Denied</h1>
            <p>You do not have permission to view this page or perform this action.</p>

            <div class="actions">
                <a href="{{ url_for('landing') }}" class="primary">Return to Homepage</a>
                <a href="{{ url_for('login') }}" class="secondary">Go to Login</a>
            </div>
            <p class="note">Sign in with an account that has the required role.</p>
        </main>
        <script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register(
            "{{ url_for('static', filename='service-worker.js') }}"
        );
    });
}
</script>
    </body>
    </html>
