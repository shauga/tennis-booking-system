<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Compound Tennis Court Booking</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.50),
                    rgba(0, 0, 0, 0.70)
                ),
                url("https://images.unsplash.com/photo-1595435934249-5df7ed86e1c0?auto=format&fit=crop&w=1800&q=85");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .register-card {
            width: 100%;
            max-width: 540px;
            padding: 44px 42px;

            background: rgba(15, 18, 15, 0.70);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 24px;

            box-shadow: 0 24px 65px rgba(0, 0, 0, 0.50);

            color: white;
            animation: cardEntrance 0.7s ease;
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.74);
            font-size: 15px;
            line-height: 1.5;
        }

        .error {
            margin-bottom: 20px;
            padding: 13px 15px;

            background: rgba(180, 30, 30, 0.34);
            border: 1px solid rgba(255, 130, 130, 0.38);
            border-radius: 10px;

            color: #ffe0e0;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;

            color: rgba(255, 255, 255, 0.88);
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            min-height: 54px;
            padding: 14px 16px;

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            outline: none;

            background: rgba(255, 255, 255, 0.95);
            color: #202020;

            font-size: 16px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        input:focus,
        select:focus {
            border-color: #82d653;
            box-shadow: 0 0 0 4px rgba(130, 214, 83, 0.18);
            transform: translateY(-1px);
        }

        select {
            cursor: pointer;
        }

        .password-input {
            padding-right: 50px;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            bottom: 16px;

            border: none;
            background: transparent;
            cursor: pointer;

            font-size: 18px;
            line-height: 1;
        }

        .strength-wrapper {
            margin-top: -8px;
            margin-bottom: 18px;
        }

        .strength-track {
            height: 7px;
            overflow: hidden;

            background: rgba(255, 255, 255, 0.18);
            border-radius: 999px;
        }

        .strength-bar {
            width: 0%;
            height: 100%;
            border-radius: 999px;
            transition:
                width 0.3s ease,
                background-color 0.3s ease;
        }

        .strength-text {
            display: block;
            margin-top: 7px;

            color: rgba(255, 255, 255, 0.64);
            font-size: 12px;
        }

        #residentFields {
            display: block;
            animation: revealFields 0.3s ease;
        }

        @keyframes revealFields {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .register-button {
            width: 100%;
            min-height: 55px;
            margin-top: 5px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(135deg, #58af2d, #8bd94f);
            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .register-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(101, 194, 53, 0.35);
        }

        .register-button:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;

            margin: 27px 0 20px;

            color: rgba(255, 255, 255, 0.48);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.18);
        }

        .login-area {
            text-align: center;
        }

        .login-area p {
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
        }

        .login-link {
            margin-left: 4px;

            color: #b9ed9b;
            font-weight: 700;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        .home-link {
            display: block;
            margin-top: 25px;

            color: rgba(255, 255, 255, 0.62);
            font-size: 13px;
            text-align: center;
            text-decoration: none;
        }

        .home-link:hover {
            color: white;
        }

        @media (max-width: 600px) {
            body {
                align-items: flex-start;
                padding: 16px;
            }

            .register-card {
                margin: 16px 0;
                padding: 34px 22px;
                border-radius: 20px;
            }

            .logo {
                font-size: 41px;
            }

            h1 {
                font-size: 29px;
            }

            .subtitle {
                font-size: 14px;
            }

            input,
            select,
            .register-button {
                min-height: 56px;
            }
        }
    </style>
    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/mobile.css') }}">
    <link
    rel="manifest"
    href="{{ url_for('static', filename='manifest.json') }}"
>

<meta name="theme-color" content="#4ea326">

<link
    rel="apple-touch-icon"
    href="{{ url_for('static', filename='icons/icon-192.png') }}"
>
<style>
.residence-select-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.select-field label{display:block;margin-bottom:7px;font-size:12px;font-weight:700}
.residence-select-grid select{width:100%;min-height:48px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.92);color:#222;font:inherit}
@media(max-width:650px){.residence-select-grid{grid-template-columns:1fr}.residence-select-grid select{min-height:52px;font-size:16px}}
</style>
</head>

<body>

    <main class="register-card">

        <header class="card-header">
            <div class="logo">🎾</div>

            <h1>Create Your Account</h1>

            <p class="subtitle">
                Register for secure access to your compound tennis court booking system.
            </p>
        </header>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" onsubmit="return validateForm()">
            <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}">

            <div class="input-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                 value="{{ form_data.username if form_data else '' }}">
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="password-input"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                    oninput="strengthCheck()"
                >

                <button
                    type="button"
                    class="password-toggle"
                    id="passwordToggle"
                    onclick="togglePass()"
                    aria-label="Show password"
                >
                    👁️
                </button>
            </div>

            <div class="strength-wrapper">
                <div class="strength-track">
                    <div class="strength-bar" id="bar"></div>
                </div>

                <span class="strength-text" id="strengthText">
                    Password strength
                </span>
            </div>

            <div class="input-group">
                <label for="confirm">Confirm password</label>

                <input
                    type="password"
                    id="confirm"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div id="residentFields">

                <div class="input-group">
                    <label for="building">Building</label>

                    <select name="building" id="building" required>
                        <option value="">Select building</option>
                        <option value="GS1" {% if form_data and form_data.building == 'GS1' %}selected{% endif %}>GS1</option>
                        <option value="GS2" {% if form_data and form_data.building == 'GS2' %}selected{% endif %}>GS2</option>
                        <option value="GS3" {% if form_data and form_data.building == 'GS3' %}selected{% endif %}>GS3</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="flat_number">Flat number</label>

                    <div class="residence-select-grid">
<div class="select-field"><label for="floor">Floor</label>
<select id="floor" name="floor" required>
<option value="">Select floor</option>
<option value="GF" {% if form_data and form_data.floor == 'GF' %}selected{% endif %}>GF</option>
{% for n in range(1, 6) %}<option value="{{ n }}" {% if form_data and form_data.floor == n|string %}selected{% endif %}>Floor {{ n }}</option>{% endfor %}
</select></div>
<div class="select-field"><label for="flat_number">Flat number</label>
<select id="flat_number" name="flat_number" data-selected="{{ form_data.flat_number if form_data else '' }}" required disabled>
<option value="">Select floor first</option>
</select></div></div>
                
                </div>

            </div>

            <div class="input-group">
                <label for="mobile_number">Mobile number</label>

                <input
                    type="tel"
                    id="mobile_number"
                    name="mobile_number"
                    placeholder="Enter your mobile number"
                    autocomplete="tel"
                    required
                 value="{{ form_data.mobile_number if form_data else '' }}">
            </div>

            <button type="submit" class="register-button">
                Create My Account
            </button>

        </form>

        <div class="divider">Already registered?</div>

        <div class="login-area">
            <p>
                Already have an account?
                <a href="/login" class="login-link">Sign in →</a>
            </p>
        </div>

        <a href="/" class="home-link">
            ← Return to homepage
        </a>

    </main>

    <script>
        function togglePass() {
            const passwordInput = document.getElementById("password");
            const toggleButton = document.getElementById("passwordToggle");

            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";
            toggleButton.textContent = isHidden ? "🙈" : "👁️";
            toggleButton.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );
        }

        function strengthCheck() {
            const password = document.getElementById("password").value;
            const bar = document.getElementById("bar");
            const text = document.getElementById("strengthText");

            let strength = 0;

            if (password.length >= 6) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            bar.style.width = `${strength * 25}%`;

            if (password.length === 0) {
                bar.style.width = "0%";
                text.textContent = "Password strength";
                text.style.color = "rgba(255,255,255,0.64)";
            } else if (strength <= 1) {
                bar.style.background = "#ff5c5c";
                text.textContent = "Weak password";
                text.style.color = "#ffb6b6";
            } else if (strength === 2) {
                bar.style.background = "#ff9f43";
                text.textContent = "Fair password";
                text.style.color = "#ffd0a0";
            } else if (strength === 3) {
                bar.style.background = "#e7d84b";
                text.textContent = "Good password";
                text.style.color = "#fff3a0";
            } else {
                bar.style.background = "#78d64b";
                text.textContent = "Strong password";
                text.style.color = "#b9ed9b";
            }
        }

        function validateForm() {
            const password = document.getElementById("password").value;
            const confirmation = document.getElementById("confirm").value;

            if (password !== confirmation) {
                alert("Passwords do not match.");
                return false;
            }

            const building = document.getElementById("building").value;
            const floor = document.getElementById("floor").value;
            const flatInput = document.getElementById("flat_number");

            if (!building || !floor || !flatInput.value) {
                alert("Please select your building, floor and flat number.");
                return false;
            }

            return true;
        }
    </script>
    <script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register(
            "{{ url_for('static', filename='service-worker.js') }}"
        );
    });
}
</script>

<script>
(function () {
    const building = document.getElementById("building");
    const floor = document.getElementById("floor");
    const flat = document.getElementById("flat_number");
    if (!building || !floor || !flat) return;

    const savedBuilding = building.value;
    const savedFloor = floor.value;
    const savedFlat = flat.dataset.selected || "";

    function floorsForBuilding(value) {
        if (value === "GS1") return ["GF", "1", "2", "3", "4", "5"];
        if (value === "GS2" || value === "GS3") return ["1", "2", "3", "4", "5"];
        return [];
    }

    function flatsForSelection(buildingValue, floorValue) {
        const values = [];
        if (!floorValue) return values;

        if (buildingValue === "GS1") {
            if (floorValue === "GF") return ["50", "51", "52"];
            const n = Number(floorValue);
            for (let x = n * 100 + 1; x <= n * 100 + 40; x++) values.push(String(x));
        } else if (buildingValue === "GS2") {
            const n = Number(floorValue);
            for (let x = n * 100 + 1; x <= n * 100 + 14; x++) values.push(String(x));
        } else if (buildingValue === "GS3") {
            const n = Number(floorValue);
            for (let unit = 1; unit <= 4; unit++) values.push(String(n * 10 + unit));
        }
        return values;
    }

    function fillFloors(restore) {
        const selected = restore ? savedFloor : "";
        const floors = floorsForBuilding(building.value);
        floor.innerHTML = '<option value="">' + (floors.length ? 'Select floor' : 'Select building first') + '</option>';
        floors.forEach(value => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value === "GF" ? "GF" : `Floor ${value}`;
            if (value === selected) option.selected = true;
            floor.appendChild(option);
        });
        floor.disabled = !floors.length;
        fillFlats(restore);
    }

    function fillFlats(restore) {
        const selected = restore ? savedFlat : "";
        const values = flatsForSelection(building.value, floor.value);
        flat.innerHTML = '<option value="">' + (values.length ? 'Select flat' : 'Select floor first') + '</option>';
        values.forEach(value => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            if (value === selected) option.selected = true;
            flat.appendChild(option);
        });
        flat.disabled = !values.length;
    }

    building.addEventListener("change", () => {
        flat.dataset.selected = "";
        fillFloors(false);
    });
    floor.addEventListener("change", () => {
        flat.dataset.selected = "";
        fillFlats(false);
    });

    if (savedBuilding) building.value = savedBuilding;
    fillFloors(true);
})();
</script>
</body>
</html>
