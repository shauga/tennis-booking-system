<!DOCTYPE html>
<html>

<head>
    <title>Forgot Password</title>
</head>

<body>

<h2>Forgot Password</h2>

<form method="POST">

    <label>Mobile Number</label><br>

    <input
    type="hidden"
    name="csrf_token"
    value="{{ csrf_token() }}">

    <input
        type="text"
        name="mobile_number"
        placeholder="38123456"
        required
    >

    <br><br>

    <button type="submit">
        Send Verification Code
    </button>

</form>

</body>

</html>
